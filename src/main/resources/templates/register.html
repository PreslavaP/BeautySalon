<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - Салон за красота</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{fragments/navbar :: navbar}"></div>
<div class="login-wrapper">
    <div class="login-box">
        <h2>Регистрация в Grace & Glow</h2>
        <form method="post" th:action="@{/register}">
            <div class="form-group">
                <label>Потребителско име:</label>
                <input name="username" placeholder="Изберете потребителско име" required type="text"/>
            </div>
            <div class="form-group">
                <label>Е-мейл:</label>
                <input name="email" placeholder="example@mail.com" required type="email"/>
            </div>
            <div class="form-group">
                <label>Парола:</label>
                <input name="password" placeholder="Въведете парола" required type="password"/>
            </div>
            <button class="btn-book" type="submit">Регистрирай се</button>
        </form>
        <div class="login-footer">
            <p>Вече имате профил? <a th:href="@{/login}">Влезте оттук</a></p>
            <a class="back-link" th:href="@{/}">← Назад към сайта</a>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
