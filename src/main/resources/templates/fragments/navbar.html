<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar">
    <header class="transparent-header">
        <div class="logo-container">
            <a th:href="@{/}">
                <img alt="Stilpres M" class="logo-img" src="" th:src="@{/images/Logos/logo-nav1.png}">
            </a>
        </div>
        <div class="nav-center-wrapper">
            <nav id="nav-menu">
                <a href="#home" th:href="@{/index}">НАЧАЛО</a>
                <a href="#about">ЗА НАС</a>
                <a href="#services">УСЛУГИ</a>
                <a href="#prices">ЦЕНОРАЗПИС</a>

                <div class="dropdown-menu-container">
                    <button class="dots-btn" onclick="toggleDropdown(event)" type="button">&#8942;</button>
                    <div class="dropdown-content" id="dropdownContent">
                        <a href="#contacts">КОНТАКТИ</a>
                        <a href="#gallery">ГАЛЕРИЯ</a>
                        <a href="#reviews">ОТЗИВИ</a>
                        <a th:href="@{/products}">ПРОДУКТИ</a>
                        <a th:href="@{/team}">ЕКИП</a>
                        <a th:href="@{/trainings}">ОБУЧЕНИЯ</a>
                    </div>
                </div>
            </nav>
        </div>

        <div class="header-right-wrapper">
            <div class="search-box-container">
                <form class="search-form">
                    <input autocomplete="off" class="search-input" placeholder="Търси..." type="text">
                    <button class="search-submit-btn" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
                <div class="search-results"></div>
            </div>

            <div class="social-icons">
                <a class="social-circle" href="https://www.facebook.com/profile.php?id=100038914457753&locale=bg_BG"
                   target="_blank" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a class="social-circle" href="https://www.instagram.com/ssttuuddiiooss/" target="_blank"
                   title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a class="social-circle" href="https://www.tiktok.com/@ssttuuddiiooss?lang=bg" target="_blank"
                   title="TikTok">
                    <i class="fab fa-tiktok"></i>
                </a>
            </div>
        </div>

        <button class="hamburger" id="hamburger-btn" onclick="document.getElementById('nav-menu').classList.toggle('active')"
                type="button">&#9776;
        </button>
    </header>
</div>
</body>
</html>
